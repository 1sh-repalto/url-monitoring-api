services:
  api:
    build: .
    container_name: url_monitoring_api
    ports:
      - "3000:3000"            # external:internal
    env_file:
      - .env.prod              # production env vars (DB creds, JWT secret, etc.)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url_monitoring_frontend
    ports:
      - "5173:80"                # public site on port 80
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata:

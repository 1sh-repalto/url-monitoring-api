version: "3.8"

services:
  api:
    build: .
    container_name: url_monitoring_api
    ports:
      - "3000:3000"
    networks:
      - monitor-net
    env_file:
      - ".env.prod"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url_monitoring_fronnted
    ports: 
      - "5173:80"
    networks:
      - monitor-net
    depends_on:
      - api

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - monitor-net

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitor-net

volumes:
  pgdata:

networks:
  monitor-net:
